<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#000000"/>
  <meta name="description" content="Suna Hanım için özel hazırlanan detaylı çalışma programı ve takip çizelgesi."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
  <title>Suna Hanım'ın Çalışma Programı</title>

  <style>
    :root {
      --bg-dark: #090a0f;
      --card-bg: #11141c;
      --card-inner: #161b26;
      --border-color: #212838;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --success: #10b981;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Üst Bar */
    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--accent);
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .badge-mentor {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: var(--accent);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 600;
    }
    .admin-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }
    .admin-btn:hover, .admin-btn.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Ana Ekran Düzeni */
    .app-layout {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 24px;
      padding: 24px;
      max-width: 1500px;
      margin: 0 auto;
      width: 100%;
      flex-grow: 1;
    }

    @media (max-width: 992px) {
      .app-layout { grid-template-columns: 1fr; }
    }

    /* Kart Yapıları */
    .panel-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 22px;
      display: flex;
      flex-direction: column;
    }

    /* İlerleme Çubuğu */
    .progress-section {
      margin-bottom: 24px;
      background-color: var(--card-inner);
      padding: 16px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }
    .progress-track {
      height: 8px;
      background-color: var(--border-color);
      border-radius: 9999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #f59e0b, #fbbf24);
      width: 0%;
      transition: width 0.35s ease;
    }

    /* Çizelge Görev Listesi */
    .section-heading {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 14px;
    }
    .task-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      max-height: 600px;
      padding-right: 4px;
    }
    .task-card {
      background-color: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .task-card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .task-card.active {
      border-color: var(--accent);
      background-color: rgba(245, 158, 11, 0.08);
    }
    .task-card.completed .task-main-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    /* Checkbox */
    .custom-checkbox {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      background-color: transparent;
      transition: 0.2s;
    }
    .task-card.completed .custom-checkbox {
      background-color: var(--success);
      border-color: var(--success);
    }
    .custom-checkbox i {
      display: none;
      color: #fff;
      font-size: 13px;
      font-weight: bold;
    }
    .task-card.completed .custom-checkbox i {
      display: block;
    }

    .task-content {
      flex-grow: 1;
      text-align: left;
    }
    .task-main-text {
      font-size: 0.88rem;
      font-weight: 600;
      display: block;
      line-height: 1.3;
    }
    .task-sub-text {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* Sağ Bölüm & Detaylar */
    .video-holder {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
      background-color: #000;
    }
    .video-holder iframe {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      border: none;
    }
    .day-details-box {
      background-color: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .day-details-box h3 {
      font-size: 0.9rem;
      color: var(--accent);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .day-details-box p {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.6;
      white-space: pre-line;
    }

    /* Düzenleme Alanları */
    .edit-field {
      width: 100%;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9rem;
      margin-bottom: 10px;
    }
    textarea.edit-field {
      min-height: 160px;
      resize: vertical;
      line-height: 1.5;
    }
    .edit-field:focus {
      outline: none;
      border-color: var(--accent);
    }

    .content-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      padding-top: 8px;
    }
    .action-btn {
      background-color: var(--accent);
      color: #090a0f;
      font-weight: 700;
      font-size: 0.88rem;
      border: none;
      padding: 12px 22px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: 0.2s;
    }
    .action-btn:hover {
      background-color: var(--accent-hover);
    }
    .action-btn.done {
      background-color: var(--success);
      color: #fff;
    }
    .save-btn {
      background-color: var(--success);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <a href="#" class="logo-area">
      <i class="bi bi-journal-check" style="font-size: 1.4rem;"></i>
      ŞUNA HANIM'IN ÇALIŞMA PROGRAMI
    </a>
    <div class="header-actions">
      <div class="badge-mentor">
        <i class="bi bi-fire me-1"></i> Haftalık Stratejik Plan
      </div>
      <button class="admin-btn" id="adminToggleBtn" onclick="handleAdminAuth()">
        <i class="bi bi-lock-fill"></i> <span id="adminBtnText">Hoca Girişi</span>
      </button>
    </div>
  </header>

  <div class="app-layout">
    <!-- Sol: Günlük Çizelge -->
    <aside class="panel-card">
      <div class="progress-section">
        <div class="progress-meta">
          <span>HAFTALIK İLERLEME</span>
          <span id="progressPercent" style="color: var(--accent);">0%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressBar"></div>
        </div>
      </div>

      <div class="section-heading">GÜNLÜK DETAYLI ÇİZELGE</div>
      <div class="task-container" id="tasksList"></div>
    </aside>

    <!-- Sağ: Detaylar ve Video -->
    <main class="panel-card">
      <div class="video-holder">
        <iframe id="mainIframe" src="" allowfullscreen></iframe>
      </div>

      <div class="day-details-box">
        <h3>
          <span>GÜNLÜK DETAYLI DERS & KONU PLANI</span>
          <span id="editStatusBadge" style="font-size: 0.75rem; color: var(--accent); display: none;">[Düzenleme Modu Açık]</span>
        </h3>
        
        <!-- Normal Görünüm -->
        <div id="viewModeContainer">
          <p id="activeDesc">Sol taraftaki çizelgeden bir gün seçin.</p>
        </div>

        <!-- Hoca Düzenleme Alanı -->
        <div id="editModeContainer" style="display: none;">
          <label style="font-size: 0.75rem; color: var(--text-muted); display: block; margin-bottom: 4px;">Gün Başlığı:</label>
          <input type="text" id="editTitleInput" class="edit-field" />
          
          <label style="font-size: 0.75rem; color: var(--text-muted); display: block; margin-bottom: 4px;">Alt Bilgi (Süre & Dersler):</label>
          <input type="text" id="editSubInput" class="edit-field" />
          
          <label style="font-size: 0.75rem; color: var(--text-muted); display: block; margin-bottom: 4px;">Konular ve Blok Detayları:</label>
          <textarea id="editDescInput" class="edit-field"></textarea>

          <label style="font-size: 0.75rem; color: var(--text-muted); display: block; margin-bottom: 4px;">YouTube Video ID (embed kodu):</label>
          <input type="text" id="editVideoInput" class="edit-field" placeholder="örneğin: dQw4w9WgXcQ" />

          <button class="save-btn" onclick="saveCurrentEdits()"><i class="bi bi-floppy"></i> Değişiklikleri Kaydet</button>
        </div>
      </div>

      <div class="content-footer">
        <div>
          <h2 id="activeTitle" style="font-size: 1.2rem; font-weight: 700; color: var(--accent); margin-bottom: 4px;">Gün Seçiniz</h2>
          <p style="color: var(--text-muted); font-size: 0.8rem;">Günü bitirdiğinizde işaretleyin.</p>
        </div>
        <button class="action-btn" id="actionBtn" onclick="toggleSelected()">
          <i class="bi bi-check2-circle"></i> Günü Tamamlandı İşaretle
        </button>
      </div>
    </main>
  </div>

  <script>
    // Varsayılan Hoca Giriş Şifresi
    const ADMIN_PASSWORD = "1234"; 
    let isAdmin = false;

    // Detaylandırılmış Varsayılan Çalışma Programı
    const defaultCurriculum = [
      { 
        id: 1, 
        title: 'Pazartesi: Türkçe & Matematik Temel', 
        sub: '6 Saat | Türkçe + Matematik + Tarih', 
        desc: '• 1. Blok (1.5 Saat) - Türkçe: Paragraf Yapısı & Anlatım Biçimleri (30 Dk Konu + 40 Soru çözümü).\n• 2. Blok (2 Saat) - Matematik: 1. Dereceden Denklemler & Eşitsizlikler (Kavrama ve Test 1-2 / 50 Soru).\n• 3. Blok (1.5 Saat) - Tarih: İslam Öncesi Türk Tarihi & Devlet Teşkilatı (Geniş Konu Tekrarı + 30 Soru).\n• 4. Blok (1 Saat) - Kapanış & Analiz: Gün boyu çözülen tüm yanlış ve boş soruların çözümlerini inceleme.', 
        videoId: 'dQw4w9WgXcQ' 
      },
      { 
        id: 2, 
        title: 'Salı: Kimya & İleri Matematik', 
        sub: '6 Saat | Mat + Kimya + Biyoloji', 
        desc: '• 1. Blok (2 Saat) - Matematik: 2. Dereceden Denklemler & Karmaşık Sayılar (Konu Anlatımı + 45 Soru).\n• 2. Blok (1.5 Saat) - Kimya: Kimyasal Hesaplamalar & Mol Kavramı Pekiştirme (35 Soru).\n• 3. Blok (1.5 Saat) - Biyoloji: Hücre Bölünmeleri & Kalıtım Giriş (Detaylı Özet + 30 Soru).\n• 4. Blok (1 Saat) - Türkçe Tekrar: Dil Bilgisi - Sözcükte Yapı ve Ekler (25 Soru).', 
        videoId: 'dQw4w9WgXcQ' 
      },
      { 
        id: 3, 
        title: 'Çarşamba: Fizik & Coğrafya Odaklı', 
        sub: '6 Saat | Fizik + Coğrafya + Türkçe', 
        desc: '• 1. Blok (2 Saat) - Fizik: Dalgalar & Hareket/Kuvvet Temel Prensipleri (Soru Üzerinden Konu Tekrarı / 40 Soru).\n• 2. Blok (1.5 Saat) - Coğrafya: Türkiye\'nin İklimi ve Yeryüzü Şekilleri (Harita Çalışması + 30 Soru).\n• 3. Blok (1.5 Saat) - Türkçe: Paragrafta Ana Fikir & Yardımcı Fikir (40 Soru Seri Çözüm).\n• 4. Blok (1 Saat) - Genel Tekrar: Matematik Formül Kartları ve Yanlış Sorular Listesi.', 
        videoId: 'dQw4w9WgXcQ' 
      },
      { 
        id: 4, 
        title: 'Perşembe: Tarih & Fen Bilimleri Tarama', 
        sub: '6 Saat | Tarih + Kimya + Fizik', 
        desc: '• 1. Blok (2 Saat) - Tarih: Kurtuluş Savaşı Hazırlık Dönemi & Genelgeler/Kongreler (Detaylı Not Çıkarma + 40 Soru).\n• 2. Blok (1.5 Saat) - Kimya: Asitler, Bazlar ve Tuzlar (Konu Odaklı Soru Çözümü / 30 Soru).\n• 3. Blok (1.5 Saat) - Fizik: Optik / Aydınlanma ve Yansıma (30 Soru).\n• 4. Blok (1 Saat) - Türkçe: Ses Bilgisi ve Yazım Kuralları (25 Soru).', 
        videoId: 'dQw4w9WgXcQ' 
      },
      { 
        id: 5, 
        title: 'Cuma: Matematik & Türkçe Tamamlama', 
        sub: '6 Saat | Matematik + Türkçe + Biyoloji', 
        desc: '• 1. Blok (2 Saat) - Matematik: Fonksiyonlar ve Grafik İnceleme (Orta/Zor Seviye 40 Soru).\n• 2. Blok (1.5 Saat) - Türkçe: Noktalama İşaretleri & Anlatım Bozuklukları (35 Soru).\n• 3. Blok (1.5 Saat) - Biyoloji: Ekosistem Ekolojisi & Güncel Çevre Sorunları (30 Soru).\n• 4. Blok (1 Saat) - Haftalık Değerlendirme: Tüm derslerden yapılamayan soru havuzu.', 
        videoId: 'dQw4w9WgXcQ' 
      },
      { 
        id: 6, 
        title: 'Cumartesi: Deneme & Detaylı Analiz', 
        sub: '6 Saat | Tam Kapsamlı Deneme', 
        desc: '• 1. Blok (2.5 Saat) - Genel Deneme Sınavı: Gerçek sınav süresine uygun tam odaklı çözüm.\n• 2. Blok (2.5 Saat) - Soru Analizi: Denemedeki tüm yanlış ve boş soruların çözümlerini deftere not etme.\n• 3. Blok (1 Saat) - Eksik Tespiti: Deneme sonucuna göre haftaya devredilecek eksiklerin listelenmesi.', 
        videoId: 'dQw4w9WgXcQ' 
      },
      { 
        id: 7, 
        title: 'Pazar: Hafif Tekrar & Haftalık Kapanış', 
        sub: '4 Saat | Esnek Çalışma & Zihinsel Dinlenme', 
        desc: '• 1. Blok (2 Saat) - Genel Tekrar: Hafta boyunca öğrenilen önemli formül, tarih ve ders notlarının gözden geçirilmesi.\n• 2. Blok (2 Saat) - Eksik Kapatma: Yetişmeyen veya eksik kalan testlerin tamamlanması.\n• Kapanış: Yeni haftanın hedeflerinin belirlenmesi ve dinlenme.', 
        videoId: 'dQw4w9WgXcQ' 
      }
    ];

    // Kayıtlı veriyi al yoksa varsayılanı yükle
    let curriculum = JSON.parse(localStorage.getItem('suna_hanim_curriculum_data')) || defaultCurriculum;
    let completedItems = JSON.parse(localStorage.getItem('suna_hanim_stratejik_program')) || [];
    let selectedId = curriculum[0].id;

    function renderView() {
      const container = document.getElementById('tasksList');
      container.innerHTML = '';

      curriculum.forEach(item => {
        const isDone = completedItems.includes(item.id);
        const isActive = item.id === selectedId;

        const card = document.createElement('div');
        card.className = `task-card ${isActive ? 'active' : ''} ${isDone ? 'completed' : ''}`;
        
        card.innerHTML = `
          <div class="custom-checkbox" onclick="event.stopPropagation(); toggleItem(${item.id});">
            <i class="bi bi-check-lg"></i>
          </div>
          <div class="task-content">
            <span class="task-main-text">${item.title}</span>
            <span class="task-sub-text">${item.sub}</span>
          </div>
        `;

        card.onclick = () => selectItem(item.id);
        container.appendChild(card);
      });

      syncProgress();
    }

    function selectItem(id) {
      selectedId = id;
      const target = curriculum.find(x => x.id === id);
      if (!target) return;

      document.getElementById('mainIframe').src = `https://www.youtube.com/embed/${target.videoId}`;
      document.getElementById('activeTitle').innerText = target.title;
      document.getElementById('activeDesc').innerText = target.desc;

      // Eğer Hoca Modu açık ise form alanlarını doldur
      if (isAdmin) {
        document.getElementById('editTitleInput').value = target.title;
        document.getElementById('editSubInput').value = target.sub;
        document.getElementById('editDescInput').value = target.desc;
        document.getElementById('editVideoInput').value = target.videoId;
      }

      renderView();
    }

    function toggleItem(id) {
      if (completedItems.includes(id)) {
        completedItems = completedItems.filter(x => x !== id);
      } else {
        completedItems.push(id);
      }
      localStorage.setItem('suna_hanim_stratejik_program', JSON.stringify(completedItems));
      renderView();
    }

    function toggleSelected() {
      toggleItem(selectedId);
    }

    function syncProgress() {
      const isDone = completedItems.includes(selectedId);
      const btn = document.getElementById('actionBtn');
      
      if (isDone) {
        btn.className = 'action-btn done';
        btn.innerHTML = '<i class="bi bi-check-all"></i> Gün Tamamlandı';
      } else {
        btn.className = 'action-btn';
        btn.innerHTML = '<i class="bi bi-check2-circle"></i> Günü Tamamlandı İşaretle';
      }

      const percent = Math.round((completedItems.length / curriculum.length) * 100);
      document.getElementById('progressBar').style.width = percent + '%';
      document.getElementById('progressPercent').innerText = percent + '%';
    }

    /* --- Hoca / Şifreli Düzenleme Fonksiyonları --- */
    function handleAdminAuth() {
      if (isAdmin) {
        // Çıkış yap
        isAdmin = false;
        toggleAdminUI();
      } else {
        const pass = prompt("Ders programını düzenlemek için hoca şifresini girin:");
        if (pass === ADMIN_PASSWORD) {
          isAdmin = true;
          alert("Giriş başarılı! Seçili günün konularını ve başlıklarını düzenleyebilirsiniz.");
          toggleAdminUI();
        } else if (pass !== null) {
          alert("Hatalı şifre!");
        }
      }
    }

    function toggleAdminUI() {
      const btnText = document.getElementById('adminBtnText');
      const btn = document.getElementById('adminToggleBtn');
      const viewContainer = document.getElementById('viewModeContainer');
      const editContainer = document.getElementById('editModeContainer');
      const badge = document.getElementById('editStatusBadge');

      if (isAdmin) {
        btnText.innerText = "Düzenlemeyi Kapat";
        btn.classList.add('active');
        viewContainer.style.display = 'none';
        editContainer.style.display = 'block';
        badge.style.display = 'inline';
        selectItem(selectedId); // Form alanlarını güncelle
      } else {
        btnText.innerText = "Hoca Girişi";
        btn.classList.remove('active');
        viewContainer.style.display = 'block';
        editContainer.style.display = 'none';
        badge.style.display = 'none';
      }
    }

    function saveCurrentEdits() {
      const targetIndex = curriculum.findIndex(x => x.id === selectedId);
      if (targetIndex === -1) return;

      curriculum[targetIndex].title = document.getElementById('editTitleInput').value;
      curriculum[targetIndex].sub = document.getElementById('editSubInput').value;
      curriculum[targetIndex].desc = document.getElementById('editDescInput').value;
      curriculum[targetIndex].videoId = document.getElementById('editVideoInput').value.trim();

      // Değişiklikleri tarayıcıya kaydet
      localStorage.setItem('suna_hanim_curriculum_data', JSON.stringify(curriculum));
      
      alert("Günün ders ve konu içeriği başarıyla güncellendi!");
      selectItem(selectedId);
    }

    // Başlat
    selectItem(selectedId);
  </script>
</body>
</html>

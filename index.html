<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#000000"/>
  <meta name="description" content="Karga Akademi ile premium mentorluk, çizelge takibi ve öğrenci-mentor yönetimi."/>
  <link rel="icon" type="image/jpeg" href="https://customer-assets.emergentagent.com/job_karga-mentorship/artifacts/sroap6d9_WhatsApp%20Image%202026-04-10%20at%2015.05.28.jpeg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
  <title>Karga Akademi | Premium Mentorluk</title>

  <style>
    :root {
      --bg-dark: #090a0f;
      --card-bg: #11141c;
      --card-inner: #161b26;
      --border-color: #212838;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Üst Bar */
    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--accent);
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }
    .logo-area img {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      object-fit: cover;
    }
    .badge-mentor {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: var(--accent);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 600;
    }

    /* Ana Ekran Düzeni */
    .app-layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 24px;
      padding: 24px;
      max-width: 1500px;
      margin: 0 auto;
      width: 100%;
      flex-grow: 1;
    }

    @media (max-width: 992px) {
      .app-layout { grid-template-columns: 1fr; }
    }

    /* Kart Yapıları */
    .panel-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 22px;
      display: flex;
      flex-direction: column;
    }

    /* İlerleme Çubuğu */
    .progress-section {
      margin-bottom: 24px;
      background-color: var(--card-inner);
      padding: 16px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }
    .progress-track {
      height: 8px;
      background-color: var(--border-color);
      border-radius: 9999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #f59e0b, #fbbf24);
      width: 0%;
      transition: width 0.35s ease;
    }

    /* Çizelge Görev Listesi */
    .section-heading {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 14px;
    }
    .task-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }
    .task-card {
      background-color: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .task-card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .task-card.active {
      border-color: var(--accent);
      background-color: rgba(245, 158, 11, 0.08);
    }
    .task-card.completed .task-main-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    /* Checkbox */
    .custom-checkbox {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      background-color: transparent;
      transition: 0.2s;
    }
    .task-card.completed .custom-checkbox {
      background-color: var(--success);
      border-color: var(--success);
    }
    .custom-checkbox i {
      display: none;
      color: #fff;
      font-size: 13px;
      font-weight: bold;
    }
    .task-card.completed .custom-checkbox i {
      display: block;
    }

    .task-content {
      flex-grow: 1;
      text-align: left;
    }
    .task-main-text {
      font-size: 0.88rem;
      font-weight: 600;
      display: block;
      line-height: 1.3;
    }
    .task-sub-text {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* Video ve Detay */
    .video-holder {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
      background-color: #000;
    }
    .video-holder iframe {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      border: none;
    }
    .content-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      padding-top: 8px;
    }
    .action-btn {
      background-color: var(--accent);
      color: #090a0f;
      font-weight: 700;
      font-size: 0.88rem;
      border: none;
      padding: 12px 22px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: 0.2s;
    }
    .action-btn:hover {
      background-color: var(--accent-hover);
    }
    .action-btn.done {
      background-color: var(--success);
      color: #fff;
    }
  </style>
</head>
<body>

  <header>
    <a href="#" class="logo-area">
      <img src="https://customer-assets.emergentagent.com/job_karga-mentorship/artifacts/sroap6d9_WhatsApp%20Image%202026-04-10%20at%2015.05.28.jpeg" alt="Logo"/>
      KARGA AKADEMİ
    </a>
    <div class="badge-mentor">
      <i class="bi bi-shield-check me-1"></i> Premium Mentorluk
    </div>
  </header>

  <div class="app-layout">
    <!-- Sol: Çizelge & Görevler -->
    <aside class="panel-card">
      <div class="progress-section">
        <div class="progress-meta">
          <span>HAFTALIK ÇİZELGE</span>
          <span id="progressPercent" style="color: var(--accent);">0%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressBar"></div>
        </div>
      </div>

      <div class="section-heading">GÖREV VE DERS ÇİZELGESİ</div>
      <div class="task-container" id="tasksList"></div>
    </aside>

    <!-- Sağ: Video ve Kontrol -->
    <main class="panel-card">
      <div class="video-holder">
        <iframe id="mainIframe" src="" allowfullscreen></iframe>
      </div>

      <div class="content-footer">
        <div>
          <h2 id="activeTitle" style="font-size: 1.2rem; font-weight: 700; color: var(--accent); margin-bottom: 4px;">Ders Seçiniz</h2>
          <p id="activeDesc" style="color: var(--text-muted); font-size: 0.85rem;">Sol taraftaki çizelgeden bir konu seçin.</p>
        </div>
        <button class="action-btn" id="actionBtn" onclick="toggleSelected()">
          <i class="bi bi-check2-circle"></i> Tamamlandı Olarak İşaretle
        </button>
      </div>
    </main>
  </div>

  <script>
    // Karga Akademi Takip Modülü
    const curriculum = [
      { id: 1, title: '1. Hafta: Mentorluk Başlangıç & Hedef Belirleme', sub: 'Temel Çizelge', desc: 'Dönem hedefleri ve haftalık çalışma temposunun ayarlanması.', videoId: 'dQw4w9WgXcQ' },
      { id: 2, title: '2. Hafta: Konu Analizi ve Temel Konseptler', sub: 'Eksik Analizi', desc: 'Deneme sonuçlarına göre öncelikli konuların belirlenmesi.', videoId: 'dQw4w9WgXcQ' },
      { id: 3, title: '3. Hafta: Pratik & Soru Çözüm Stratejileri', sub: 'Hız Kazanımı', desc: 'Zaman yönetimi ve pratik test çözme teknikleri.', videoId: 'dQw4w9WgXcQ' },
      { id: 4, title: '4. Hafta: Aylık Genel Değerlendirme', sub: 'Raporlama & Gelişim', desc: 'Aylık ilerleme tablosunun gözden geçirilmesi ve yeni planlama.', videoId: 'dQw4w9WgXcQ' }
    ];

    let completedItems = JSON.parse(localStorage.getItem('karga_full_academy_data')) || [];
    let selectedId = curriculum[0].id;

    function renderView() {
      const container = document.getElementById('tasksList');
      container.innerHTML = '';

      curriculum.forEach(item => {
        const isDone = completedItems.includes(item.id);
        const isActive = item.id === selectedId;

        const card = document.createElement('div');
        card.className = `task-card ${isActive ? 'active' : ''} ${isDone ? 'completed' : ''}`;
        
        card.innerHTML = `
          <div class="custom-checkbox" onclick="event.stopPropagation(); toggleItem(${item.id});">
            <i class="bi bi-check-lg"></i>
          </div>
          <div class="task-content">
            <span class="task-main-text">${item.title}</span>
            <span class="task-sub-text">${item.sub}</span>
          </div>
        `;

        card.onclick = () => selectItem(item.id);
        container.appendChild(card);
      });

      syncProgress();
    }

    function selectItem(id) {
      selectedId = id;
      const target = curriculum.find(x => x.id === id);
      if (!target) return;

      document.getElementById('mainIframe').src = `https://www.youtube.com/embed/${target.videoId}`;
      document.getElementById('activeTitle').innerText = target.title;
      document.getElementById('activeDesc').innerText = target.desc;
      renderView();
    }

    function toggleItem(id) {
      if (completedItems.includes(id)) {
        completedItems = completedItems.filter(x => x !== id);
      } else {
        completedItems.push(id);
      }
      localStorage.setItem('karga_full_academy_data', JSON.stringify(completedItems));
      renderView();
    }

    function toggleSelected() {
      toggleItem(selectedId);
    }

    function syncProgress() {
      const isDone = completedItems.includes(selectedId);
      const btn = document.getElementById('actionBtn');
      
      if (isDone) {
        btn.className = 'action-btn done';
        btn.innerHTML = '<i class="bi bi-check-all"></i> Görev Tamamlandı';
      } else {
        btn.className = 'action-btn';
        btn.innerHTML = '<i class="bi bi-check2-circle"></i> Tamamlandı Olarak İşaretle';
      }

      const percent = Math.round((completedItems.length / curriculum.length) * 100);
      document.getElementById('progressBar').style.width = percent + '%';
      document.getElementById('progressPercent').innerText = percent + '%';
    }

    // Başlat
    selectItem(selectedId);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#000000"/>
  <meta name="description" content="Şuna Hanım için özel hazırlanan 6 saatlik stratejik çalışma programı ve takip çizelgesi."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
  <title>Suna Hanım'ın Çalışma Programı</title>

  <style>
    :root {
      --bg-dark: #090a0f;
      --card-bg: #11141c;
      --card-inner: #161b26;
      --border-color: #212838;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Üst Bar */
    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--accent);
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }
    .badge-mentor {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: var(--accent);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 600;
    }

    /* Ana Ekran Düzeni */
    .app-layout {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 24px;
      padding: 24px;
      max-width: 1500px;
      margin: 0 auto;
      width: 100%;
      flex-grow: 1;
    }

    @media (max-width: 992px) {
      .app-layout { grid-template-columns: 1fr; }
    }

    /* Kart Yapıları */
    .panel-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 22px;
      display: flex;
      flex-direction: column;
    }

    /* İlerleme Çubuğu */
    .progress-section {
      margin-bottom: 24px;
      background-color: var(--card-inner);
      padding: 16px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }
    .progress-track {
      height: 8px;
      background-color: var(--border-color);
      border-radius: 9999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #f59e0b, #fbbf24);
      width: 0%;
      transition: width 0.35s ease;
    }

    /* Çizelge Görev Listesi */
    .section-heading {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 14px;
    }
    .task-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      max-height: 600px;
      padding-right: 4px;
    }
    .task-card {
      background-color: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .task-card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .task-card.active {
      border-color: var(--accent);
      background-color: rgba(245, 158, 11, 0.08);
    }
    .task-card.completed .task-main-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    /* Checkbox */
    .custom-checkbox {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      background-color: transparent;
      transition: 0.2s;
    }
    .task-card.completed .custom-checkbox {
      background-color: var(--success);
      border-color: var(--success);
    }
    .custom-checkbox i {
      display: none;
      color: #fff;
      font-size: 13px;
      font-weight: bold;
    }
    .task-card.completed .custom-checkbox i {
      display: block;
    }

    .task-content {
      flex-grow: 1;
      text-align: left;
    }
    .task-main-text {
      font-size: 0.88rem;
      font-weight: 600;
      display: block;
      line-height: 1.3;
    }
    .task-sub-text {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* Sağ Bölüm & Detaylar */
    .video-holder {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
      background-color: #000;
    }
    .video-holder iframe {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      border: none;
    }
    .day-details-box {
      background-color: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .day-details-box h3 {
      font-size: 0.9rem;
      color: var(--accent);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .day-details-box p {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.6;
      white-space: pre-line;
    }

    .content-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      padding-top: 8px;
    }
    .action-btn {
      background-color: var(--accent);
      color: #090a0f;
      font-weight: 700;
      font-size: 0.88rem;
      border: none;
      padding: 12px 22px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: 0.2s;
    }
    .action-btn:hover {
      background-color: var(--accent-hover);
    }
    .action-btn.done {
      background-color: var(--success);
      color: #fff;
    }
  </style>
</head>
<body>

  <header>
    <a href="#" class="logo-area">
      <i class="bi bi-journal-check" style="font-size: 1.4rem;"></i>
      ŞUNA HANIM'IN ÇALIŞMA PROGRAMI
    </a>
    <div class="badge-mentor">
      <i class="bi bi-fire me-1"></i> Günlük 6 Saat Stratejik Plan
    </div>
  </header>

  <div class="app-layout">
    <!-- Sol: Günlük Çizelge -->
    <aside class="panel-card">
      <div class="progress-section">
        <div class="progress-meta">
          <span>HAFTALIK İLERLEME</span>
          <span id="progressPercent" style="color: var(--accent);">0%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressBar"></div>
        </div>
      </div>

      <div class="section-heading">6 SAATLİK GÜNLÜK ÇİZELGE</div>
      <div class="task-container" id="tasksList"></div>
    </aside>

    <!-- Sağ: Detaylar ve Video -->
    <main class="panel-card">
      <div class="video-holder">
        <iframe id="mainIframe" src="" allowfullscreen></iframe>
      </div>

      <div class="day-details-box">
        <h3>Günlük 6 Saatlik Blok Detayları</h3>
        <p id="activeDesc">Sol taraftaki çizelgeden bir gün seçin.</p>
      </div>

      <div class="content-footer">
        <div>
          <h2 id="activeTitle" style="font-size: 1.2rem; font-weight: 700; color: var(--accent); margin-bottom: 4px;">Gün Seçiniz</h2>
          <p style="color: var(--text-muted); font-size: 0.8rem;">Günü bitirdiğinizde işaretleyin.</p>
        </div>
        <button class="action-btn" id="actionBtn" onclick="toggleSelected()">
          <i class="bi bi-check2-circle"></i> Günü Tamamlandı İşaretle
        </button>
      </div>
    </main>
  </div>

  <script>
    // 6 Saatlik Stratejik Günlük Program Verileri
    const curriculum = [
      { 
        id: 1, 
        title: 'Salı: Kimya & Tarih Odaklı', 
        sub: '6 Saat | Türkçe + Mat + Kimya + Tarih', 
        desc: '• 1. Blok (1 Saat): Türkçe & Paragraf (30 dk paragraf denemesi + 30 dk dil bilgisi tekrarı).\n• 2. Blok (2 Saat): Matematik - 1. ve 2. Dereceden Denklemler (Konu tekrarı + 40-50 soru).\n• 3. Blok (1.5 Saat): Kimya Hesaplamaları ve Fizik Dalgalar Sonrası.\n• 4. Blok (1 Saat): Tarih (Kurtuluş Savaşı Hazırlık Dönemi) + Biyoloji/Coğrafya mini tekrar.\n• Kapanış (30 Dk): Günlük yanlış analizi.', 
        videoId: 'dQw4w9WgXcQ' 
      },
      { 
        id: 2, 
        title: 'Çarşamba: Fizik & Denklemler', 
        sub: '6 Saat | Türkçe + Mat + Fizik + Sosyal', 
        desc: '• 1. Blok (1 Saat): Türkçe Paragraf ve Dil Bilgisi.\n• 2. Blok (2 Saat): Matematik - 1. ve 2. Dereceden Denklemler pekiştirme ve soru çözümü.\n• 3. Blok (1.5 Saat): Fizik (Dalgalar sonrasındaki konu) + Kimya kısa tekrar.\n• 4. Blok (1 Saat): Biyoloji ve Coğrafya genel tekrar turları.\n• Kapanış (30 Dk): Soru ve yanlış çözüm tahlili.', 
        videoId: 'dQw4w9WgXcQ' 
      },
      { 
        id: 3, 
        title: 'Perşembe: İleri Seviye Matematik', 
        sub: '6 Saat | Türkçe + Mat + Kimya + Tarih', 
        desc: '• 1. Blok (1 Saat): Paragraf & Dil bilgisi soru çözümü.\n• 2. Blok (2 Saat): Matematik - Denklemlerden orta-zor kaynak taraması.\n• 3. Blok (1.5 Saat): Kimya (Kimyasal Hesaplamalar derinlemesine soru çözümü).\n• 4. Blok (1 Saat): Tarih (Kurtuluş Savaşı Hazırlık & İlk Olaylar).\n• Kapanış (30 Dk): Günlük analiz.', 
        videoId: 'dQw4w9WgXcQ' 
      },
      { 
        id: 4, 
        title: 'Cuma: Branş Tarama & Fizik', 
        sub: '6 Saat | Türkçe + Mat + Fizik + Fen Tekrar', 
        desc: '• 1. Blok (1 Saat): Türkçe paragraf ve eksik dil bilgisi konuları.\n• 2. Blok (2 Saat): Matematik - Denklemler tarama testi.\n• 3. Blok (1.5 Saat): Fizik (Güncel konu soru çözümü ve pekiştirme).\n• 4. Blok (1 Saat): Biyoloji ve Coğrafya tamamlama testleri.\n• Kapanış (30 Dk): Genel haftalık eksik tespiti.', 
        videoId: 'dQw4w9WgXcQ' 
      },
      { 
        id: 5, 
        title: 'Cumartesi: Mini Deneme & Analiz', 
        sub: '6 Saat | Deneme ve Kapsamlı Tekrar', 
        desc: '• 1. Blok (2 Saat): Genel TYT Mini Deneme Sınavı.\n• 2. Blok (2.5 Saat): Deneme Analizi (Yanlış yapılan ve boş bırakılan tüm soruların hocadan/çözümden öğrenilmesi).\n• 3. Blok (1 Saat): Haftanın zorlanan konularının tekrarı.\n• Kapanış (30 Dk): Dinlenme ve haftayı kapatma.', 
        videoId: 'dQw4w9WgXcQ' 
      },
      { 
        id: 6, 
        title: 'Pazar: Eksik Kapanışı & Dinlenme', 
        sub: 'Esnek Çalışma & Planlama', 
        desc: '• Hafta içinde yetişmeyen eksiklerin kapatılması.\n• Zihinsel dinlenme ve yeni haftanın programına hazırlık.', 
        videoId: 'dQw4w9WgXcQ' 
      },
      { 
        id: 7, 
        title: 'Pazartesi: Yeni Hafta Başlangıcı', 
        sub: '6 Saat | Temel Dersler', 
        desc: '• 1. Blok (1 Saat): Türkçe paragraf & dil bilgisi.\n• 2. Blok (2 Saat): Matematik temel konular / denklemler.\n• 3. Blok (1.5 Saat): Kimya & Fizik.\n• 4. Blok (1 Saat): Tarih & Coğrafya.\n• Kapanış (30 Dk): Günlük analiz.', 
        videoId: 'dQw4w9WgXcQ' 
      }
    ];

    let completedItems = JSON.parse(localStorage.getItem('suna_hanim_stratejik_program')) || [];
    let selectedId = curriculum[0].id;

    function renderView() {
      const container = document.getElementById('tasksList');
      container.innerHTML = '';

      curriculum.forEach(item => {
        const isDone = completedItems.includes(item.id);
        const isActive = item.id === selectedId;

        const card = document.createElement('div');
        card.className = `task-card ${isActive ? 'active' : ''} ${isDone ? 'completed' : ''}`;
        
        card.innerHTML = `
          <div class="custom-checkbox" onclick="event.stopPropagation(); toggleItem(${item.id});">
            <i class="bi bi-check-lg"></i>
          </div>
          <div class="task-content">
            <span class="task-main-text">${item.title}</span>
            <span class="task-sub-text">${item.sub}</span>
          </div>
        `;

        card.onclick = () => selectItem(item.id);
        container.appendChild(card);
      });

      syncProgress();
    }

    function selectItem(id) {
      selectedId = id;
      const target = curriculum.find(x => x.id === id);
      if (!target) return;

      document.getElementById('mainIframe').src = `https://www.youtube.com/embed/${target.videoId}`;
      document.getElementById('activeTitle').innerText = target.title;
      document.getElementById('activeDesc').innerText = target.desc;
      renderView();
    }

    function toggleItem(id) {
      if (completedItems.includes(id)) {
        completedItems = completedItems.filter(x => x !== id);
      } else {
        completedItems.push(id);
      }
      localStorage.setItem('suna_hanim_stratejik_program', JSON.stringify(completedItems));
      renderView();
    }

    function toggleSelected() {
      toggleItem(selectedId);
    }

    function syncProgress() {
      const isDone = completedItems.includes(selectedId);
      const btn = document.getElementById('actionBtn');
      
      if (isDone) {
        btn.className = 'action-btn done';
        btn.innerHTML = '<i class="bi bi-check-all"></i> Gün Tamamlandı';
      } else {
        btn.className = 'action-btn';
        btn.innerHTML = '<i class="bi bi-check2-circle"></i> Günü Tamamlandı İşaretle';
      }

      const percent = Math.round((completedItems.length / curriculum.length) * 100);
      document.getElementById('progressBar').style.width = percent + '%';
      document.getElementById('progressPercent').innerText = percent + '%';
    }

    // Başlat (Varsayılan olarak Salı seçili başlar)
    selectItem(selectedId);
  </script>
</body>
</html>
